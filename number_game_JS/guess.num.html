<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the number</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=sports_esports" />

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            text-align: center;
        }

        h1 {

            font-family: sans-serif;
            font-size: 4rem;
            color: darkslategray;
            margin: 20px;
        }


        .material-symbols-outlined {
            font-size: 4rem;
            color: #70140b;
            vertical-align: middle;
        }

        .parrafo {
            font-size: 2rem;
            color: darkslategrey;
            padding-bottom: 20px;
        }

        label {
            font-size: 1.5rem;
            color: darkslategray;
        }

        #btn_comprobar {
            background-color: darkcyan;
            color: white;
            padding: 5px 5px;
            cursor: pointer;
        }

        #mensaje {
            padding: 40px;
            font-size: 1.5rem;
            
        }

        .error {
            color: red;
        }

        .correcto {
            color: green;
        }

        .cerca {
            color: orange;
        }

        .p-intentos {
            font-size: 1.5rem;
            color: darkslategray;
            text-align: center;
            align-items: center;
        }
    </style>

    </style>
</head>

<body>
    <div class="contenedor">
        <h1>
            <span class="material-symbols-outlined">sports_esports</span>
            Adivina un numero

            <span class="material-symbols-outlined">sports_esports</span>
        </h1>

        <p class="parrafo"> Intenta adivinar un número entre 1 y 100!</p>


        <label for="in_number">Escribe tu número:</label>
        <input type="number" id="in_number" size="2" min="1" max="100">
        <button id="btn_comprobar">comprobar</button>

        <p class="p_mensaje" id="mensaje"></p>

        <p class="p-intentos">Numero de intentos: <span id="intentos">0</span></p>

    </div>

    <script>
        let azar = Math.ceil(Math.random() * 100);

        let intentos = 0;

        function checkNumber() {
            let number = Number(document.getElementById('in_number').value);

            console.log(azar)

            intentos++;

            //document.getElementById('in_numero').value = '';
            let hiddenNumber = Math.abs(azar - number)

            if (hiddenNumber === 0) {
                document.getElementById('mensaje').textContent = 'Felicidades, Correcto!'
                mensaje.classList.add('correcto');
            }

            else if (hiddenNumber <= 5) {
                document.getElementById('mensaje').textContent = 'Estas muy cerca!';
                mensaje.classList.add('cerca');
            }

            else if (hiddenNumber <= 15) {
                document.getElementById('mensaje').textContent = 'Estas cerca!'
                mensaje.classList.add('cerca');
            } else {
                document.getElementById('mensaje').textContent = 'Estas lejos'
                mensaje.classList.add('error');
            }

            document.getElementById('intentos').textContent = intentos;
            console.log(intentos)

        }



        document.getElementById('btn_comprobar').onclick = checkNumber;

    </script>
</body>

</html>
