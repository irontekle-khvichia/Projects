<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guess the number</title>
    <link rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200&icon_names=sports_esports" />

    <style>
         * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #F3F5F4;
            font-family: Arial, sans-serif;
            padding: 20px;
        }

        .contenedor {
            width: 100%;
            max-width: 500px;
            padding: 40px 35px;
            background-color: white;
            border: 1px solid #E1E7E3;
            border-radius: 12px;
            text-align: center;
        }

        h1 {
            font-size: 2.2rem;
            color: #164E52;
            margin-bottom: 20px;
        }

        .material-symbols-outlined {
            font-size: 2rem;
            color: #39877B;
            vertical-align: middle;
        }

        .parrafo {
            font-size: 1.1rem;
            color: #77736D;
            margin-bottom: 30px;
            line-height: 1.6;
        }

        label {
            display: block;
            font-size: 1rem;
            color: #292927;
            margin-bottom: 12px;
        }

        #in_number {
            width: 100%;
            padding: 12px;
            border: 1px solid #D5DDD8;
            border-radius: 6px;
            font-size: 1.1rem;
            text-align: center;
            margin-bottom: 15px;
        }

        #in_number:focus {
            outline: none;
            border-color: #39877B;
        }

        #btn_comprobar {
            width: 100%;
            padding: 12px;
            background-color: #39877B;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
        }

        #btn_comprobar:hover {
            background-color: #164E52;
        }

        #mensaje {
            min-height: 65px;
            padding: 25px 10px 10px;
            font-size: 1.1rem;
        }

        .error {
            color: #C34B4B;
        }

        .correcto {
            color: #39877B;
        }

        .cerca {
            color: #D18B32;
        }

        .p-intentos {
            padding: 15px;
            background-color: #F2F6F3;
            border-radius: 6px;
            font-size: 1rem;
            color: #292927;
        }

        #intentos {
            color: #164E52;
            font-weight: bold;
        }

       
    </style>

    </style>
</head>

<body>
    <div class="contenedor">
        <h1>
            <span class="material-symbols-outlined">sports_esports</span>
            Adivina un numero

            <span class="material-symbols-outlined">sports_esports</span>
        </h1>

        <p class="parrafo"> Intenta adivinar un número entre 1 y 100!</p>


        <label for="in_number">Escribe tu número:</label>
        <input type="number" id="in_number" size="2" min="1" max="100">
        <button id="btn_comprobar">comprobar</button>

        <p class="p_mensaje" id="mensaje"></p>

        <p class="p-intentos">Numero de intentos: <span id="intentos">0</span></p>

    </div>

    <script>
        let azar = Math.ceil(Math.random() * 100);

        let intentos = 0;

        function checkNumber() {
            let number = Number(document.getElementById('in_number').value);

            console.log(azar)

            intentos++;

            //document.getElementById('in_numero').value = '';
            let hiddenNumber = Math.abs(azar - number)

            if (hiddenNumber === 0) {
                document.getElementById('mensaje').textContent = 'Felicidades, Correcto!'
                mensaje.classList.add('correcto');
            }

            else if (hiddenNumber <= 5) {
                document.getElementById('mensaje').textContent = 'Estas muy cerca!';
                mensaje.classList.add('cerca');
            }

            else if (hiddenNumber <= 15) {
                document.getElementById('mensaje').textContent = 'Estas cerca!'
                mensaje.classList.add('cerca');
            } else {
                document.getElementById('mensaje').textContent = 'Estas lejos'
                mensaje.classList.add('error');
            }

            document.getElementById('intentos').textContent = intentos;
            console.log(intentos)

        }



        document.getElementById('btn_comprobar').onclick = checkNumber;

    </script>
</body>

</html>
